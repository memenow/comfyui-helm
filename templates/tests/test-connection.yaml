apiVersion: v1
kind: Pod
metadata:
  name: "{{ include "comfyui-helm.fullname" . }}-test-connection"
  labels:
    {{- include "comfyui-helm.labels" . | nindent 4 }}
  annotations:
    helm.sh/hook: test
    helm.sh/hook-delete-policy: before-hook-creation,hook-succeeded
spec:
  restartPolicy: Never
  containers:
    - name: curl
      image: curlimages/curl:8.10.1
      command:
        - sh
        - -c
        - |
          # Hit /system_stats which returns JSON as soon as the HTTP server is
          # up. Retry to accommodate the model preload window, although the
          # pod's readinessProbe should already gate traffic at this point.
          curl -fsS --retry 12 --retry-all-errors --retry-delay 5 \
            "http://{{ include "comfyui-helm.fullname" . }}:{{ .Values.service.port }}/system_stats"
